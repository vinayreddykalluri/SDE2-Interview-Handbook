name: Deploy Documentation

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'apps/portal/**'
      - 'examples/java/**'
      # The published site embeds the book web library, so book sources and
      # the publishing manifest must trigger a redeploy too. Without these the
      # site silently serves the previous edition after a content change.
      - 'books/java-sde2-interview-preparation-series/content/**'
      - 'books/java-sde2-interview-preparation-series/publishing/**'
      - 'tooling/automation/validate_*.py'
      - 'tooling/automation/build_site.py'
      - 'tooling/automation/build_book_web_library.py'
      - 'tooling/book-web/**'
      - 'mkdocs.yml'
      - 'tooling/requirements/**'
      - 'Makefile'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  # The Makefile defaults to PYTHON = .venv/bin/python for local development.
  # CI installs into the runner's Python and never creates a venv, so every
  # make target died instantly with "make: .venv/bin/python: No such file or
  # directory". The default uses ?=, so this environment variable overrides it.
  PYTHON: python

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tooling/requirements/authoring.txt

      - name: Validate source
        run: make validate

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build unified web and docs site
        run: make build-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
