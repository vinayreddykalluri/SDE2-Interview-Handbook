name: Validate published books

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-books-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: books/java-sde2-interview-preparation-series

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: books/java-sde2-interview-preparation-series/requirements.txt

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install book dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate master sources
        run: python scripts/validate_book.py --source-only

      - name: Validate focused series and Java companions
        run: python scripts/validate_series.py --source-only

      # The deterministic release preflight checks all four segment assignments
      # across series.json, the portal catalog, and dist/manifest.json. It does
      # not build or require the large PDF files in a source-validation job.
      - name: Validate synchronized web catalog and artifact metadata
        working-directory: .
        run: python tooling/automation/build_all.py --check-only

      - name: Compile master Java examples
        run: |
          mkdir -p examples/java/build/classes
          find examples/java/src/main/java -name '*.java' -print0 \
            | xargs -0 javac --release 21 -Xlint:all -Werror -d examples/java/build/classes
          java -cp examples/java/build/classes com.interviewbook.examples.AllExamplesSmokeTest
